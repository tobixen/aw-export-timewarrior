# Pre-commit hooks for aw-export-timewarrior
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  # Ruff - An extremely fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      # Run the linter
      - id: ruff-check
        args: [--fix]
      # Run the formatter
      - id: ruff-format

  # Additional useful hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-toml
      - id: mixed-line-ending
        args: ['--fix=lf']

  # AI prompt auto-commit: records prompts used during development and appends
  # them to commit messages automatically (via Claude Code UserPromptSubmit hook).
  # Run once manually to set up: pre-commit run --hook-stage manual prepare-ai-repository
  - repo: https://github.com/pycalendar/ai-prompt-auto-commit
    rev: v0.0.8
    hooks:
      - id: unstage-ai-prompts
      - id: append-ai-prompts
        stages: [prepare-commit-msg]
      - id: archive-ai-prompts
        stages: [post-commit]
      - id: prepare-ai-repository
        stages: [manual]

  # Conventional Commits enforcement on commit-msg
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Link checker (cached for speed)
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      - id: lychee
        args: ["--no-progress", "--timeout", "10", "--cache", "--max-cache-age", "1d", "."]
        # Scan the repo via the "." arg only (as CI does), never per-file: with
        # pass_filenames on (the default), pre-commit appends the changed files
        # as explicit inputs, which forces lychee to extract "links" from files
        # a "." scan skips - the regex patterns inside .lycheeignore itself and
        # the fake URLs in tests/fixtures/*.json - and those fail the hook.
        pass_filenames: false
        stages: [pre-push]

  # PRE-PUSH: verify lint and format before pushing (mirrors CI checks)
  - repo: local
    hooks:
      - id: ruff-check-push
        name: ruff lint (pre-push)
        entry: ruff check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: ruff-format-check-push
        name: ruff format check (pre-push)
        entry: ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # PRE-PUSH: run the (slow) test suite before pushing, but only on main.
  # Pushing main triggers CI *and* the PyPI publish, so guard it hardest here.
  # On feature branches the suite is skipped locally - the PR's CI run covers it,
  # and the full run is too slow to gate every feature-branch push.
  - repo: local
    hooks:
      - id: pytest
        name: pytest (main branch only)
        entry: "bash -c 'if [ \"$(git branch --show-current)\" = \"main\" ]; then exec pytest; else echo \"skipping pytest (not on main)\"; fi'"
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
